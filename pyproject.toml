[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cook-all-data-foundation"
version = "0.2.0"
description = "Cook All MongoDB data service, crawler and admin API"
requires-python = ">=3.11"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "fastapi>=0.115,<1",
  "jsonschema>=4.23,<5",
  "PyJWT>=2.9,<3",
  "pymongo>=4.10,<5",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.12,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1"]

[project.scripts]
cookall-data = "cookall_data.cli:main"
cookall-api = "cookall_data.api:run"

[tool.setuptools.packages.find]
where = ["src"]
